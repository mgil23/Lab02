[project]
name = "openidp-pii-sanitizer"
version = "1.0.0"
description = "OpenIDP PII Sanitizer — Presidio-based reversible anonymization"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "presidio-analyzer>=2.2.356",
    "presidio-anonymizer>=2.2.356",
    "spacy>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
