[project]
name = "openidp-strands-agents"
version = "1.0.0"
description = "OpenIDP AWS Strands Agents integration for intelligent extraction"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "litellm>=1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
